name: Testing
on: 
  push:
    branches: [main]

env:
  MOZ_HEADLESS: true
  GECKODRIVER_VERSION: v0.36.0

jobs:
  build:
    name: Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
    
      - name: Check Firefox
        run: |
          firefox --version

      - name: Check Geckodriver
        run: |
          geckodriver --version
